<script type="text/javascript">
  (function () {
    // Closed lists; test/unit/keys.test.js asserts they match lib/keys.js.
    const ALGS = {
      signing: [
        "HS256",
        "HS384",
        "HS512",
        "RS256",
        "RS384",
        "RS512",
        "PS256",
        "PS384",
        "PS512",
        "ES256",
        "ES384",
        "ES512",
        "Ed25519",
      ],
      encryption: ["dir", "RSA-OAEP-256", "ECDH-ES+A256KW"],
    };
    RED.nodes.registerType("jose-key", {
      category: "config",
      defaults: {
        name: { value: "" },
        family: { value: "signing", validate: (v) => Object.hasOwn(ALGS, v) },
        source: { value: "secret" },
        alg: {
          value: "auto",
          validate: function (v) {
            const sourceInput = $("#node-config-input-source");
            const source = sourceInput.length ? sourceInput.val() : this.source;
            if (["local-jwks", "remote-jwks"].includes(source)) return true;
            const input = $("#node-config-input-family");
            const family = input.length ? input.val() : this.family === undefined ? "signing" : this.family;
            return Object.hasOwn(ALGS, family) && (v === "auto" || ALGS[family].includes(v));
          },
        },
        secretEncoding: { value: "base64" },
        algorithms: {
          value: "",
          validate: function (v) {
            const input = $("#node-config-input-source");
            const source = input.length ? input.val() : this.source === undefined ? "secret" : this.source;
            if (!["local-jwks", "remote-jwks"].includes(source)) return true;
            if (typeof v !== "string") return false;
            const values = v
              .split(",")
              .map((part) => part.trim())
              .filter(Boolean);
            return values.length > 0 && values.every((alg) => ALGS.signing.includes(alg) && !alg.startsWith("HS"));
          },
        },
        url: {
          value: "",
          validate: function (v) {
            const input = $("#node-config-input-source");
            const source = input.length ? input.val() : this.source === undefined ? "secret" : this.source;
            if (source !== "remote-jwks") return true;
            if (typeof v !== "string" || v.trim() === "") return false;
            let url;
            try {
              url = new URL(v.trim());
            } catch {
              return false;
            }
            if (url.username || url.password || url.hash) return false;
            if (url.protocol === "https:") return true;
            const box = $("#node-config-input-allowInsecureLoopback");
            const allow = box.length ? box.is(":checked") : this.allowInsecureLoopback === true;
            return url.protocol === "http:" && allow && ["127.0.0.1", "[::1]", "localhost"].includes(url.hostname);
          },
        },
        allowInsecureLoopback: {
          value: false,
          validate: function (v) {
            const input = $("#node-config-input-source");
            const source = input.length ? input.val() : this.source;
            return source !== "remote-jwks" || v === undefined || typeof v === "boolean";
          },
        },
        cacheSeconds: {
          value: 600,
          validate: function (v) {
            const input = $("#node-config-input-source");
            const source = input.length ? input.val() : this.source === undefined ? "secret" : this.source;
            if (source !== "remote-jwks" || v === undefined) return true;
            return (
              (typeof v === "number" || typeof v === "string") &&
              String(v).trim() !== "" &&
              Number.isSafeInteger(Number(v)) &&
              Number(v) >= 1 &&
              Number(v) <= 3600
            );
          },
        },
        timeoutSeconds: {
          value: 5,
          validate: function (v) {
            const input = $("#node-config-input-source");
            const source = input.length ? input.val() : this.source === undefined ? "secret" : this.source;
            if (source !== "remote-jwks" || v === undefined) return true;
            return (
              (typeof v === "number" || typeof v === "string") &&
              String(v).trim() !== "" &&
              Number.isSafeInteger(Number(v)) &&
              Number(v) >= 1 &&
              Number(v) <= 30
            );
          },
        },
      },
      credentials: {
        secret: { type: "password" },
        pem: { type: "password" },
        passphrase: { type: "password" },
        jwk: { type: "password" },
      },
      label: function () {
        return this.name || `jose key (${this.source}, ${this.alg === "auto" ? "auto" : this.alg})`;
      },
      oneditprepare: function () {
        const saved = this.alg === undefined ? "auto" : this.alg;
        const rebuildAlgs = (event) => {
          const family = $("#node-config-input-family").val();
          const current = $("#node-config-input-alg").val() || saved;
          const options = ["auto", ...(Object.hasOwn(ALGS, family) ? ALGS[family] : [])];
          $("#node-config-input-alg")
            .empty()
            .append(
              options.map((a) =>
                $("<option>")
                  .val(a)
                  .text(a === "auto" ? "auto (from the key)" : a),
              ),
            )
            .val(options.includes(current) ? current : event ? "auto" : "");
        };
        // One handler shows only the rows that belong to the selected source; typed values in hidden rows are kept.
        const show = () => {
          const source = $("#node-config-input-source").val();
          $(".jose-dialog [data-source]").each(function () {
            $(this).toggle($(this).attr("data-source").split(" ").includes(source));
          });
        };
        $("#node-config-input-family").on("change", rebuildAlgs);
        $("#node-config-input-source").on("change", show);
        $("#node-config-input-allowInsecureLoopback").on("change", () => $("#node-config-input-url").trigger("change"));
        rebuildAlgs();
        show();
      },
    });
  })();
</script>

        <option value="pem">PEM key or certificate</option>

      <label for="node-config-input-cacheSeconds"><i class="fa fa-clock-o"></i> Cache</label>
      <input
        type="number"
        id="node-config-input-cacheSeconds"
        min="1"

        step="1"
        placeholder="600"
        style="width: 85px"

      <span>seconds (1–3600)</span>
    </div>
    <div class="form-row" data-source="remote-jwks">
      <label for="node-config-input-timeoutSeconds"><i class="fa fa-hourglass-half"></i> Timeout</label>
      <input
        type="number"
        id="node-config-input-timeoutSeconds"
        min="1"
        max="30"
        step="1"
        placeholder="5"
        style="width: 85px"
      />
      <span>seconds (1–30)</span>
    </div>
    <div class="form-row" data-source="local-jwks remote-jwks">
      <label for="node-config-input-algorithms"><i class="fa fa-cog"></i> Algorithms</label>
      <input type="text" id="node-config-input-algorithms" placeholder="RS256, ES256" />
    </div>
    <div class="form-row" data-source="pem">
      <label for="node-config-input-pem"><i class="fa fa-file-text-o"></i> PEM</label>
      <textarea id="node-config-input-pem" rows="8" autocomplete="off" spellcheck="false"></textarea>
    </div>
    <div class="form-row" data-source="pem">
      <label for="node-config-input-passphrase"><i class="fa fa-lock"></i> Passphrase</label>
      <input type="password" id="node-config-input-passphrase" autocomplete="new-password" />
    </div>
    <div class="form-row" data-source="jwk local-jwks">
      <label for="node-config-input-jwk"><i class="fa fa-file-code-o"></i> JWK</label>
      <textarea id="node-config-input-jwk" rows="8" autocomplete="off" spellcheck="false"></textarea>
    </div>
    <div class="form-tips" data-source="secret pem jwk local-jwks">
      Stored material shows as <code>__PWRD__</code>; paste to replace, clear to remove.
    </div>
  </div>
</script>

<script type="text/markdown" data-help-name="jose-key">
  Holds one key for the jose nodes: a shared secret, a PEM key or certificate, a JSON Web Key, or a JSON Web Key Set, used either for signing or for encryption.

  ### Details

  Key material is stored in Node-RED credentials, never in the exported flow. Once saved, the editor shows `__PWRD__` instead of the stored value; paste new material to replace it or clear the field to remove it. A credential may also be a whole-value environment reference such as `${JWT_SECRET}`.

  Each key configuration serves exactly one family, signing or encryption, and binds one algorithm. `auto` picks it from the material: a shared secret gives `HS256` for signing and `dir` with `A256GCM` for encryption. The operation nodes inherit the algorithm; a token header can never choose it.

  A shared secret is decoded strictly with the selected encoding (`base64` by default, as produced by `openssl rand -base64 32`). It must be at least 32 bytes for `HS256`, 48 for `HS384`, 64 for `HS512`, and exactly 32 bytes for encryption. Length is checked, randomness is up to you.

  A PEM key may be a private key (PKCS#8, PKCS#1 or SEC1, optionally encrypted with the _Passphrase_), a public key (SPKI or PKCS#1) or an X.509 certificate, whose public key is extracted without any chain validation. A private key serves both directions of its family; a public key or certificate can only verify or encrypt. RSA keys need at least 2048 bits; supported curves are P-256, P-384, P-521, Ed25519 (signing) and X25519 (encryption). `auto` picks `RS256`, `ES256`/`ES384`/`ES512`, `Ed25519`, `RSA-OAEP-256` or `ECDH-ES+A256KW` from the key type.

  A JSON Web Key retains its metadata when passed to jose, so its `alg`, `use` and `key_ops` members are enforced: a declared `alg` becomes the bound algorithm, `use` must match the family, and a private key whose `key_ops` exclude the public operation cannot verify or encrypt. Private and public copies narrow `key_ops` to their respective operations without adding permissions. For RSA-OAEP, encryption requires both `encrypt` and `wrapKey`, and decryption both `decrypt` and `unwrapKey`, when `key_ops` is present. For ECDH, `deriveBits` permits deriving a public copy with no WebCrypto usages. An `oct` key follows the shared-secret rules; for encryption its `alg` names the content encryption `A256GCM`.

  A pasted JSON Web Key Set verifies signatures only. Members must be public asymmetric keys, at most 100, and _Algorithms_ must list the accepted JWS algorithms; with more than one algorithm every member must declare its own `alg`. The token `kid` selects the key.

  When the material cannot be used, the configuration logs a warning at deploy time, dependent nodes show `key error`, and every message they receive fails with `KEY_UNUSABLE`.

  A remote JSON Web Key Set verifies signatures only. It is fetched lazily from _JWKS URL_ over `https` and cached for _Cache_ seconds (600 by default); the network timeout is _Timeout_ seconds (5 by default). Plain `http` is accepted only for `127.0.0.1`, `[::1]` or `localhost` when _Loopback_ is ticked, for local testing, and logs a warning at deploy. _Algorithms_ must list accepted asymmetric JWS algorithms. With several algorithms, keys without their own `alg` are ineligible.

  jose selects the key by `kid`. An unknown `kid` can trigger a refetch once the 30-second cooldown since the last successful fetch ends; during cooldown it is rejected without another request. Expired caches refresh on use. Removed keys can remain accepted until refresh; changing the key configuration or a full deploy creates a fresh cache. Redeploying only a consumer keeps the shared cache. A pending fetch may continue until completion or timeout after a consumer closes, but that consumer ignores the late result.

  Transport failures, non-200 responses and unparsable bodies are `JWKS_FETCH`. A stall before response headers is `ERR_JWKS_TIMEOUT`; a stalled body after 200 headers is `JWKS_FETCH`. Invalid sets or unusable matching key material are `ERR_JWKS_INVALID`; these faults always reach Catch. There is no package-enforced response byte or key-count limit, and a timeout does not bound memory use.

  ### References

  - [RFC 7518 section 3.2](https://www.rfc-editor.org/rfc/rfc7518#section-3.2) - minimum HMAC key sizes
  - [RFC 8725 JWT Best Current Practices](https://www.rfc-editor.org/rfc/rfc8725) - algorithm and key policy
</script>
