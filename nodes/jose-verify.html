<script type="text/javascript">
  RED.nodes.registerType("jose-verify", {
    category: "jose",
    color: "#a6bbcf",
    icon: "font-awesome/fa-check-square-o",
    inputs: 1,
    outputs: 2,
    inputLabels: "token",
    outputLabels: ["verified", "rejected"],
    paletteLabel: "jose verify",
    defaults: {
      name: { value: "" },
      key: { value: "", type: "jose-key" },
      tokenFrom: { value: "payload", required: true },
      tokenFromType: { value: "msg" },
      stripBearer: { value: true },
      typ: { value: "JWT" },
      requiredClaims: { value: "exp" },
      audience: {
        value: "",
        validate: function (v) {
          return (
            v === undefined ||
            (typeof v === "string" && (v.trim() === "" || v.split(",").some((part) => part.trim() !== "")))
          );
        },
      },
      claimsTo: {
        value: "payload",
        required: true,
        validate: function (v) {
          return (
            typeof v === "string" &&
            /^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*$/.test(v) &&
            !v.split(".").includes("__proto__")
          );
        },
      },
      claimsToType: { value: "msg" },
      issuer: {
        value: "",
        validate: function (v) {
          return (
            v === undefined ||
            (typeof v === "string" && (v.trim() === "" || v.split(",").some((part) => part.trim() !== "")))
          );
        },
      },
      subject: { value: "" },
      clockTolerance: {
        value: 0,
        validate: function (v) {
          return (
            v === undefined ||
            v === "" ||
            ((typeof v === "string" || typeof v === "number") &&
              String(v).trim() !== "" &&
              Number.isSafeInteger(Number(v)) &&
              Number(v) >= 0 &&
              Number(v) <= 300)
          );
        },
      },
      maxTokenAge: {
        value: "",
        validate: function (v) {
          return (
            v === undefined ||
            v === "" ||
            ((typeof v === "string" || typeof v === "number") &&
              String(v).trim() !== "" &&
              Number.isSafeInteger(Number(v)) &&
              Number(v) >= 1 &&
              Number(v) <= Number.MAX_SAFE_INTEGER)
          );
        },
      },
      headerTo: {
        value: "",
        validate: function (v) {
          if (v === undefined || v === "") return true;
          if (
            typeof v !== "string" ||
            !/^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*$/.test(v) ||
            v.split(".").includes("__proto__")
          )
            return false;
          const input = $("#node-input-claimsTo");
          const claimsTo = input.length ? input.val() : this.claimsTo === undefined ? "payload" : this.claimsTo;
          if (typeof claimsTo !== "string") return false;
          const a = claimsTo.replace(/^msg\./, "").split("."),
            b = v.replace(/^msg\./, "").split(".");
          const n = Math.min(a.length, b.length);
          for (let i = 0; i < n; i++) if (a[i] !== b[i]) return true;
          return false;
        },
      },
      headerToType: { value: "msg" },
      failureMode: { value: "catch" },
    },
    label: function () {
      return this.name || "jose verify";
    },
    oneditprepare: function () {
      // Imported nodes may omit optional fields: show the runtime defaults instead of blank controls.
      const defaults = { typ: "JWT", requiredClaims: "exp", clockTolerance: 0, failureMode: "catch" };
      for (const [name, value] of Object.entries(defaults))
        if (this[name] === undefined) $(`#node-input-${name}`).val(value);
      if (this.stripBearer === undefined) $("#node-input-stripBearer").prop("checked", true);
      $("#node-input-tokenFrom").typedInput({
        default: "msg",
        typeField: "#node-input-tokenFromType",
        types: ["msg", "flow", "global", "jsonata"],
      });
      $("#node-input-claimsTo").typedInput({ default: "msg", typeField: "#node-input-claimsToType", types: ["msg"] });
      $("#node-input-headerTo").typedInput({ default: "msg", typeField: "#node-input-headerToType", types: ["msg"] });
    },
  });
</script>

<script type="text/html" data-template-name="jose-verify">
  <div class="jose-dialog">
    <div class="form-row">
      <label for="node-input-key"><i class="fa fa-key"></i> Key</label>
      <input type="text" id="node-input-key" />
    </div>
    <div class="form-row">

      <input type="hidden" id="node-input-tokenFromType" />

    <div class="form-row">

      <span>strip a leading <code>Bearer</code></span>
    </div>
    <div class="form-row">
      <label for="node-input-typ"><i class="fa fa-tag"></i> Type</label>
      <input type="text" id="node-input-typ" placeholder="JWT" style="width: 70%" />
    </div>
    <div class="form-row">
      <label for="node-input-requiredClaims"><i class="fa fa-check"></i> Required</label>
      <input type="text" id="node-input-requiredClaims" placeholder="exp" style="width: 70%" />
    </div>
    <div class="form-row">
      <label for="node-input-audience"><i class="fa fa-users"></i> Audience</label>
      <input type="text" id="node-input-audience" placeholder="Optional recipient list" style="width: 70%" />
    </div>
    <div class="form-row">
      <label for="node-input-issuer"><i class="fa fa-building-o"></i> Issuer</label>
      <input type="text" id="node-input-issuer" placeholder="Optional accepted issuer list" style="width: 70%" />
    </div>
    <div class="form-row">
      <label for="node-input-subject"><i class="fa fa-user-o"></i> Subject</label>
      <input type="text" id="node-input-subject" placeholder="Optional required subject" style="width: 70%" />
    </div>
    <div class="form-row">
      <label for="node-input-clockTolerance"><i class="fa fa-clock-o"></i> Tolerance</label>
      <input
        type="number"
        id="node-input-clockTolerance"
        min="0"
        max="300"
        step="1"
        placeholder="0"
        style="width: 70%"
      />
    </div>
    <div class="form-row">
      <label for="node-input-maxTokenAge"><i class="fa fa-hourglass-end"></i> Max age</label>
      <input
        type="number"
        id="node-input-maxTokenAge"
        min="1"
        step="1"
        placeholder="seconds since iat, blank for no limit"
        style="width: 70%"
      />
    </div>
    <div class="form-row">
      <label for="node-input-claimsTo"><i class="fa fa-sign-out"></i> Claims to</label>
      <input type="text" id="node-input-claimsTo" />
      <input type="hidden" id="node-input-claimsToType" />
    </div>
    <div class="form-row">
      <label for="node-input-headerTo"><i class="fa fa-list-alt"></i> Header to</label>
      <input type="text" id="node-input-headerTo" placeholder="optional" />
      <input type="hidden" id="node-input-headerToType" />
    </div>
    <div class="form-row">
      <label for="node-input-failureMode"><i class="fa fa-random"></i> On rejection</label>
      <select id="node-input-failureMode" style="width: 70%">
        <option value="catch">throw an error (Catch node)</option>
        <option value="output">send to the second output</option>
      </select>
    </div>
    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
      <input type="text" id="node-input-name" placeholder="Name" />
    </div>
  </div>
</script>

<script type="text/markdown" data-help-name="jose-verify">
  Verifies a compact JSON Web Token against the selected key and its bound algorithm, then outputs the claims.

  ### Inputs

  : payload (string) : The token, by default. Any message, flow or global property or a JSONata expression can be selected, for example `req.headers.authorization`. A leading `Bearer` scheme is removed when _Bearer_ is ticked.

  ### Outputs

  1. Verified
     : payload (object) : The validated claims, by default; another message property can be selected.
  2. Rejected
     : error (object) : `{ code, message, claim, reason }` when _On rejection_ sends rejected tokens here instead of throwing.

  ### Details

  Output paths may start with `msg.`: `msg.result` and `result` name the same destination. Overlap and writability checks use that destination.

  Only the algorithms bound to the key configuration are accepted (one algorithm for a single key, the configured list for a JSON Web Key Set); a token with any other `alg` fails with `ERR_JOSE_ALG_NOT_ALLOWED`. The `typ` header must equal _Type_ (`JWT` by default) unless _Type_ is blank, which disables the check. _Required_ is a comma-separated list of claims that must be present, `exp` by default; clear it to accept tokens without an expiry. _Issuer_ and _Audience_ are comma-separated lists of accepted values; _Subject_ is one required value; blank disables each check. _Tolerance_ allows up to 300 seconds of clock skew on `exp`, `nbf` and `iat`; _Max age_ rejects tokens whose `iat` is older than the given seconds. _Header to_ optionally stores the protected header (`alg`, `typ`, `kid`) in another message property after validation succeeds.

  _Audience_ lists acceptable recipients, separated by commas. At least one must match the token’s `aud` claim. Blank disables this check; message properties cannot override it.

  Token rejections (`NO_TOKEN`, `INPUT_TOO_LARGE`, `ERR_JWT_EXPIRED`, `ERR_JWT_CLAIM_VALIDATION_FAILED`, `ERR_JWS_SIGNATURE_VERIFICATION_FAILED`, `ERR_JWS_INVALID`, `ERR_JOSE_ALG_NOT_ALLOWED` and the other codes listed in the troubleshooting guide) either throw to a Catch node or, with _On rejection_ set to the second output, leave with `msg.error` set. Configuration and key failures (`NO_KEY_CONFIG`, `KEY_UNUSABLE`, `INVALID_INPUT`, `OUTPUT_INVALID`, `NODE_CLOSING`) always throw. Errors never carry the token, its claims or any original error text.

  > [!WARNING]
  > A verified token proves who issued it and that it has not been altered. Whether the caller may do what it asks is a separate decision for your flow.

  Subject matching preserves whitespace. Maximum age is a positive whole number of seconds; blank disables it. Output paths must also be separate when message properties share the same object.

  ### References

  - [RFC 7519 JSON Web Token](https://www.rfc-editor.org/rfc/rfc7519) - claims validation
  - [RFC 8725 JWT Best Current Practices](https://www.rfc-editor.org/rfc/rfc8725) - verification policy
</script>
