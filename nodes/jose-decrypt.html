<script type="text/javascript">
  RED.nodes.registerType("jose-decrypt", {
    category: "jose",
    color: "#a6bbcf",
    icon: "font-awesome/fa-unlock-alt",
    inputs: 1,
    outputs: 2,
    inputLabels: "token",
    outputLabels: ["decrypted", "rejected"],
    paletteLabel: "jose decrypt",
    defaults: {
      name: { value: "" },
      key: { value: "", type: "jose-key" },
      tokenFrom: { value: "payload", required: true },
      tokenFromType: { value: "msg" },
      stripBearer: { value: false },
      typ: { value: "JWT" },
      requiredClaims: { value: "exp" },
      audience: {
        value: "",
        validate: function (v) {
          return (
            v === undefined ||
            (typeof v === "string" && (v.trim() === "" || v.split(",").some((part) => part.trim() !== "")))
          );
        },
      },
      claimsTo: {
        value: "payload",
        required: true,
        validate: function (v) {
          return (
            typeof v === "string" &&
            /^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*$/.test(v) &&
            !v.split(".").includes("__proto__")
          );
        },
      },
      claimsToType: { value: "msg" },
      issuer: {
        value: "",
        validate: function (v) {
          return (
            v === undefined ||
            (typeof v === "string" && (v.trim() === "" || v.split(",").some((part) => part.trim() !== "")))
          );
        },
      },
      subject: { value: "" },
      clockTolerance: {
        value: 0,
        validate: function (v) {
          return (
            v === undefined ||
            v === "" ||
            ((typeof v === "string" || typeof v === "number") &&
              String(v).trim() !== "" &&
              Number.isSafeInteger(Number(v)) &&
              Number(v) >= 0 &&
              Number(v) <= 300)
          );
        },
      },
      maxTokenAge: {
        value: "",
        validate: function (v) {
          return (
            v === undefined ||
            v === "" ||
            ((typeof v === "string" || typeof v === "number") &&
              String(v).trim() !== "" &&
              Number.isSafeInteger(Number(v)) &&
              Number(v) >= 1 &&
              Number(v) <= Number.MAX_SAFE_INTEGER)
          );
        },
      },
      headerTo: {
        value: "",
        validate: function (v) {
          if (v === undefined || v === "") return true;
          if (
            typeof v !== "string" ||
            !/^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*$/.test(v) ||
            v.split(".").includes("__proto__")
          )
            return false;
          const input = $("#node-input-claimsTo");
          const claimsTo = input.length ? input.val() : this.claimsTo === undefined ? "payload" : this.claimsTo;
          if (typeof claimsTo !== "string") return false;
          const a = claimsTo.split("."),
            b = v.split(".");
          const n = Math.min(a.length, b.length);
          for (let i = 0; i < n; i++) if (a[i] !== b[i]) return true;
          return false;
        },
      },
      headerToType: { value: "msg" },
      failureMode: { value: "catch" },
    },
    label: function () {
      return this.name || "jose decrypt";
    },
    oneditprepare: function () {
      $("#node-input-tokenFrom").typedInput({
        default: "msg",
        typeField: "#node-input-tokenFromType",
        types: ["msg", "flow", "global", "jsonata"],
      });
      $("#node-input-claimsTo").typedInput({ default: "msg", typeField: "#node-input-claimsToType", types: ["msg"] });
      $("#node-input-headerTo").typedInput({ default: "msg", typeField: "#node-input-headerToType", types: ["msg"] });
    },
  });
</script>

    </div>
    <div class="form-row">
      <label for="node-input-headerTo"><i class="fa fa-list-alt"></i> Header to</label>
      <input type="text" id="node-input-headerTo" placeholder="optional" />
      <input type="hidden" id="node-input-headerToType" />
    </div>
    <div class="form-row">
      <label for="node-input-failureMode"><i class="fa fa-random"></i> On rejection</label>
      <select id="node-input-failureMode" style="width: 70%">
        <option value="catch">throw an error (Catch node)</option>
        <option value="output">send to the second output</option>

    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
      <input type="text" id="node-input-name" placeholder="Name" />
    </div>
  </div>
</script>

<script type="text/markdown" data-help-name="jose-decrypt">
  Decrypts a compact JSON Web Encryption token with the selected key and its bound algorithm, validates the claims, then outputs them.

  ### Inputs

  : payload (string) : The five-part compact JWE, by default. Any message, flow or global property or a JSONata expression can be selected. A leading `Bearer` scheme is removed only when _Bearer_ is ticked (off by default).

  ### Outputs

  1. Decrypted
     : payload (object) : The decrypted and validated claims, by default; another message property can be selected.
  2. Rejected
     : error (object) : `{ code, message, claim, reason }` when _On rejection_ sends rejected tokens here instead of throwing.

  ### Details

  Only the key-management algorithm bound to the key configuration and the `A256GCM` content encryption are accepted. _Type_, _Required_, _Issuer_, _Audience_, _Subject_, _Tolerance_, _Max age_ and _Header to_ work exactly as in `jose-verify`.

  _Audience_ lists acceptable recipients, separated by commas. At least one must match the token’s `aud` claim. Blank disables this check; message properties cannot override it.

  Token rejections (`NO_TOKEN`, `INPUT_TOO_LARGE`, `ERR_JWE_INVALID`, `ERR_JWE_DECRYPTION_FAILED`, `ERR_JWT_EXPIRED`, `ERR_JWT_CLAIM_VALIDATION_FAILED`, `ERR_JOSE_ALG_NOT_ALLOWED` and the other codes in the troubleshooting guide) either throw to a Catch node or, with _On rejection_ set to the second output, leave with `msg.error` set. Configuration and key failures always throw. A failed validation never reveals the decrypted claims: errors carry only the code, the claim name and the reason.

  > [!WARNING]
  > With a shared secret, any holder can create encrypted tokens. Public-key encryption does not authenticate the sender. Verify a signature when issuer authentication is required.

  Subject matching preserves whitespace. Maximum age is a positive whole number of seconds; blank disables it. Output paths must also be separate when message properties share the same object.

  ### References

  - [RFC 7516 JSON Web Encryption](https://www.rfc-editor.org/rfc/rfc7516) - compact serialization
  - [RFC 7519 JSON Web Token](https://www.rfc-editor.org/rfc/rfc7519) - claims validation
</script>
