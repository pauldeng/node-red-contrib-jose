<script type="text/javascript">
  (function () {
    const YEAR = 31536000;
    const live = (node, prop) => $(`#node-input-${prop}`).val() || node[prop];
    const isInt = (v, min, max) =>
      (typeof v === "number" || typeof v === "string") &&
      String(v).trim() !== "" &&
      Number.isSafeInteger(Number(v)) &&
      Number(v) >= min &&
      Number(v) <= max;
    RED.nodes.registerType("jose-encrypt", {
      category: "jose",
      color: "#a6bbcf",
      icon: "font-awesome/fa-lock",
      inputs: 1,
      outputs: 1,
      inputLabels: "claims",
      outputLabels: "token",
      paletteLabel: "jose encrypt",
      defaults: {
        name: { value: "" },
        key: { value: "", type: "jose-key" },
        claims: { value: "payload", required: true },
        claimsType: { value: "msg" },
        typ: { value: "JWT" },
        expiryMode: { value: "ttl" },
        ttlSeconds: {
          value: 3600,
          validate: function (v, opt) {
            return (
              v === undefined ||
              (live(this, "expiryMode") ?? "ttl") !== "ttl" ||
              isInt(v, 1, YEAR) ||
              (opt ? `1 to ${YEAR} seconds` : false)
            );
          },
        },
        expiresAt: {
          value: "",
          validate: function (v, opt) {
            return (
              live(this, "expiryMode") !== "absolute" ||
              isInt(v, 0, Number.MAX_SAFE_INTEGER) ||
              (opt ? "Unix time in seconds" : false)
            );
          },
        },
        issuedAt: { value: true },
        notBeforeMode: { value: "preserve" },
        notBeforeSeconds: {
          value: 0,
          validate: function (v, opt) {
            return (
              v === undefined ||
              live(this, "notBeforeMode") !== "offset" ||
              isInt(v, -YEAR, YEAR) ||
              (opt ? `-${YEAR} to ${YEAR} seconds` : false)
            );
          },
        },
        notBeforeAt: {
          value: "",
          validate: function (v, opt) {
            return (
              live(this, "notBeforeMode") !== "absolute" ||
              isInt(v, 0, Number.MAX_SAFE_INTEGER) ||
              (opt ? "Unix time in seconds" : false)
            );
          },
        },
        tokenTo: {
          value: "payload",
          required: true,
          validate: function (v) {
            return (
              typeof v === "string" &&
              /^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*$/.test(v) &&
              !v.split(".").includes("__proto__")
            );
          },
        },
        tokenToType: { value: "msg" },
        issuer: { value: "" },
        issuerType: { value: "str" },
        subject: { value: "" },
        subjectType: { value: "str" },
        audience: { value: "" },
        audienceType: { value: "str" },
        jti: { value: "" },
        jtiType: { value: "str" },
        kid: { value: "" },
        kidType: { value: "str" },
      },
      label: function () {
        return this.name || "jose encrypt";
      },
      oneditprepare: function () {
        // Imported nodes may omit optional fields: show the runtime default instead of a blank control,
        // otherwise the dialog misrepresents behaviour and saving would persist an empty, invalid value.
        const defaults = {
          expiryMode: "ttl",
          ttlSeconds: 3600,
          notBeforeMode: "preserve",
          notBeforeSeconds: 0,
          typ: "JWT",
        };
        for (const [name, value] of Object.entries(defaults))
          if (this[name] === undefined) $(`#node-input-${name}`).val(value);
        if (this.issuedAt === undefined) $("#node-input-issuedAt").prop("checked", true);
        $("#node-input-claims").typedInput({
          default: "msg",
          typeField: "#node-input-claimsType",
          types: ["msg", "flow", "global", "json", "jsonata"],
        });
        $("#node-input-tokenTo").typedInput({ default: "msg", typeField: "#node-input-tokenToType", types: ["msg"] });
        const dynamic = ["str", "msg", "flow", "global", "env"];
        for (const name of ["issuer", "subject", "kid"])
          $(`#node-input-${name}`).typedInput({ default: "str", typeField: `#node-input-${name}Type`, types: dynamic });
        $("#node-input-audience").typedInput({
          default: "str",
          typeField: "#node-input-audienceType",
          types: ["str", "json", "msg", "flow", "global", "env"],
        });
        $("#node-input-jti").typedInput({
          default: "str",
          typeField: "#node-input-jtiType",
          types: ["str", { value: "uuid", label: "random UUID", hasValue: false }, "msg", "flow", "global", "env"],
        });
        const show = () => {
          const exp = $("#node-input-expiryMode").val();
          const nbf = $("#node-input-notBeforeMode").val();
          $(".jose-dialog [data-expiry]").each(function () {
            $(this).toggle($(this).attr("data-expiry") === exp);
          });
          $(".jose-dialog [data-nbf]").each(function () {
            $(this).toggle($(this).attr("data-nbf") === nbf);
          });
        };
        $("#node-input-expiryMode, #node-input-notBeforeMode").on("change", show);
        show();
      },
    });
  })();
</script>

    <div class="form-row" data-nbf="absolute">

    </div>
    <div class="form-row">
      <label for="node-input-issuedAt"><i class="fa fa-calendar-o"></i> Issued at</label>
      <input type="checkbox" id="node-input-issuedAt" style="width: auto; vertical-align: top" />
      <span>set <code>iat</code> to now</span>
    </div>
    <div class="form-row">
      <label for="node-input-typ"><i class="fa fa-tag"></i> Type</label>
      <input type="text" id="node-input-typ" placeholder="JWT" style="width: 70%" />
    </div>
    <div class="form-row">
      <label for="node-input-issuer"><i class="fa fa-building-o"></i> Issuer</label>
      <input type="text" id="node-input-issuer" placeholder="keep claim iss" />
      <input type="hidden" id="node-input-issuerType" />
    </div>
    <div class="form-row">
      <label for="node-input-subject"><i class="fa fa-user-o"></i> Subject</label>
      <input type="text" id="node-input-subject" placeholder="keep claim sub" />
      <input type="hidden" id="node-input-subjectType" />
    </div>
    <div class="form-row">
      <label for="node-input-audience"><i class="fa fa-users"></i> Audience</label>
      <input type="text" id="node-input-audience" placeholder="keep claim aud" />
      <input type="hidden" id="node-input-audienceType" />
    </div>
    <div class="form-row">
      <label for="node-input-jti"><i class="fa fa-hashtag"></i> JWT ID</label>
      <input type="text" id="node-input-jti" placeholder="keep claim jti" />
      <input type="hidden" id="node-input-jtiType" />
    </div>
    <div class="form-row">
      <label for="node-input-kid"><i class="fa fa-key"></i> Key ID</label>
      <input type="text" id="node-input-kid" placeholder="from the key when it has one" />
      <input type="hidden" id="node-input-kidType" />
    </div>
    <div class="form-row">
      <label for="node-input-tokenTo"><i class="fa fa-sign-out"></i> Token to</label>
      <input type="text" id="node-input-tokenTo" />
      <input type="hidden" id="node-input-tokenToType" />
    </div>
    <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
      <input type="text" id="node-input-name" placeholder="Name" />
    </div>
  </div>
</script>

<script type="text/markdown" data-help-name="jose-encrypt">
  Encrypts a claims object into a compact JSON Web Encryption token (an encrypted JWT) using the algorithm bound to the selected key.

  ### Inputs

  : payload (object) : The claims to encrypt, by default. Any message, flow or global property, a JSON literal or a JSONata expression can be selected instead. It must be a plain JSON object.

  ### Outputs

  : payload (string) : The five-part compact JWE, by default. Another message property can be selected; the rest of the message is preserved.

  ### Details

  Output paths may start with `msg.`: `msg.result` and `result` name the same destination. Overlap and writability checks use that destination.

  The key configuration must use the _Encryption_ family. A shared secret of exactly 32 bytes gives direct encryption (`dir`) with `A256GCM`. The token header carries `alg`, `enc` and, unless _Type_ is blank, `typ` (`JWT` by default).

  _Issuer_, _Subject_, _Audience_, _JWT ID_ and _Key ID_ work exactly as in `jose-sign`. Expiry, not-before and issued-at too: the active mode sets the claim, _keep_ leaves the incoming claim, _omit_ removes it, and the input object is never modified.

  Failures are reported through `done(error)`, so a Catch node receives them with `msg.error.code`: `NO_KEY_CONFIG`, `KEY_UNUSABLE`, `INVALID_CLAIMS`, `INVALID_INPUT`, `OUTPUT_INVALID`, `NODE_CLOSING`.

  > [!WARNING]
  > Encryption hides the claims from anyone without the key, but it does not prove who produced the token: with a shared secret every holder can encrypt, and with a public key anyone can. Sign first when the recipient must know the issuer.

  ### References

  - [RFC 7516 JSON Web Encryption](https://www.rfc-editor.org/rfc/rfc7516) - compact serialization
  - [RFC 7518 section 4 and 5](https://www.rfc-editor.org/rfc/rfc7518) - `dir` and `A256GCM`
</script>
